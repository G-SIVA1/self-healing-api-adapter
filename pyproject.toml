[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[project]
name = "self-healing-api-adapter"
version = "0.1.0"
description = "Autonomous self-healing API compatibility agent"
requires-python = ">=3.12"
dependencies = [
    "chromadb",
    "openai>=1.0.0",
    "google-genai",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true